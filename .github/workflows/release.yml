name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish, for example v1.0.0. Must match apps/cli/Cargo.toml.
        required: true
        type: string
      publish_latest:
        description: Also move the GHCR latest tag to this container image.
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      container-tags: ${{ steps.release.outputs.container-tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: release
        name: Validate version, branch, and image tags
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run releases from the main branch. Current ref is $GITHUB_REF."
            exit 1
          fi

          tag="${{ inputs.version }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be a SemVer tag like v1.0.0 without build metadata."
            exit 1
          fi

          version="${tag#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/cli/Cargo.toml | head -n 1)"
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::apps/cli/Cargo.toml version is $cargo_version, expected $version."
            exit 1
          fi

          server_version="$(sed -n 's/^export const SERVER_VERSION = "\(.*\)";/\1/p' apps/server/src/version.ts)"
          if [ "$server_version" != "$version" ]; then
            echo "::error::SERVER_VERSION in apps/server/src/version.ts is $server_version, expected $version."
            exit 1
          fi

          if ! grep -qx 'export const CLI_RELEASE_BINARIES_BY_DEFAULT = true;' apps/server/src/node-http.ts; then
            echo "::error::Set CLI_RELEASE_BINARIES_BY_DEFAULT = true in apps/server/src/node-http.ts before releasing, or nodes keep building the preview branch (apps/cli/docs/releasing.md)."
            exit 1
          fi

          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "image=$image"
            echo "container-tags<<EOF"
            echo "$image:$tag"
            echo "$image:$version"
            echo "$image:sha-$GITHUB_SHA"
            if [ "${{ inputs.publish_latest }}" = "true" ]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  release-preflight:
    name: CLI release preflight
    needs: validate
    uses: ./.github/workflows/release-preflight.yml
    secrets: inherit

  # Each platform builds on a native runner and pushes by digest only; the
  # publish job below joins the digests into one multi-arch tagged image.
  # Building arm64 under QEMU on an x86 runner could hang until the job timed out.
  build-container:
    name: Build GHCR container (${{ matrix.platform }})
    needs:
      - validate
      - release-preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            # GitHub has no ubuntu-latest arm64 label; this is the matching image as of 2026-11.
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Compute apt cache-bust date
        id: apt-cache
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }} image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.validate.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=FlyCockpit LLC
            org.opencontainers.image.title=WS Model Proxy
            org.opencontainers.image.description=Self-hosted OpenAI-compatible model routing through outbound websockets.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            APT_CACHE_DATE=${{ steps.apt-cache.outputs.date }}
          cache-from: type=gha,scope=release-app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-app-${{ matrix.arch }}
          provenance: false

      - name: Scan ${{ matrix.arch }} image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ needs.validate.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Record image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-container:
    name: Publish GHCR container
    needs:
      - validate
      - build-container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create and push multi-arch tags
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          CONTAINER_TAGS: ${{ needs.validate.outputs.container-tags }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail

          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error::Expected 2 platform digests, found ${#sources[@]}."
            exit 1
          fi

          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<< "$CONTAINER_TAGS"

          docker buildx imagetools create "${tag_args[@]}" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            --annotation "index:org.opencontainers.image.vendor=FlyCockpit LLC" \
            --annotation "index:org.opencontainers.image.title=WS Model Proxy" \
            --annotation "index:org.opencontainers.image.description=Self-hosted OpenAI-compatible model routing through outbound websockets." \
            --annotation "index:org.opencontainers.image.url=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"

  plan-cli-release:
    name: Plan CLI release
    needs:
      - validate
      - release-preflight
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ needs.validate.outputs.tag }}
      tag-flag: --tag=${{ needs.validate.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Create local release tag
        working-directory: apps/cli
        run: git tag --force "${{ needs.validate.outputs.tag }}" "${{ github.sha }}"

      - name: Install dist
        shell: bash
        working-directory: apps/cli
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.34.0/cargo-dist-installer.sh | sh

      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      - id: plan
        name: Plan dist release
        working-directory: apps/cli
        run: |
          dist host --steps=create --tag=${{ needs.validate.outputs.tag }} --allow-dirty --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-plan-dist-manifest
          path: apps/cli/plan-dist-manifest.json

  build-cli-local-artifacts:
    name: build-cli-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs: plan-cli-release
    if: ${{ fromJson(needs.plan-cli-release.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-cli-release.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      # Baked into wsmp (`option_env!`): its hello reports the commit it was built from, so the
      # server can tell two builds of one version apart (apps/cli/docs/releasing.md).
      WSMP_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - name: Enable Windows long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Create local release tag
        working-directory: apps/cli
        run: git tag --force "${{ needs.plan-cli-release.outputs.tag }}" "${{ github.sha }}"

      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install dist
        run: ${{ matrix.install_dist.run }}

      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: apps/cli/target/distrib/
          merge-multiple: true

      - name: Install dependencies
        working-directory: apps/cli
        run: |
          ${{ matrix.packages_install }}

      - name: Configure native musl compilers
        if: ${{ contains(join(matrix.targets, ','), '-linux-musl') }}
        shell: bash
        env:
          RELEASE_TARGETS: ${{ join(matrix.targets, ' ') }}
        run: |
          set -euo pipefail
          for target in $RELEASE_TARGETS; do
            case "$target" in *-unknown-linux-musl) ;; *) continue ;; esac
            compiler_target=${target//-/_}
            echo "CC_${compiler_target}=musl-gcc" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_${compiler_target^^}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          done

      - name: Build artifacts
        working-directory: apps/cli
        run: |
          dist build ${{ needs.plan-cli-release.outputs.tag-flag }} --allow-dirty --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"

      # dist 0.34's v0 config has no per-target include. Add musl's MIT
      # notice after packaging, then refresh both checksum files and manifest
      # hashes before global artifacts (installers/sha256.sum) are generated.
      - name: Verify static musl binaries and include their licence notice
        if: ${{ contains(join(matrix.targets, ','), '-linux-musl') }}
        shell: bash
        working-directory: apps/cli
        env:
          RELEASE_TARGETS: ${{ join(matrix.targets, ' ') }}
        run: |
          set -euo pipefail
          for target in $RELEASE_TARGETS; do
            case "$target" in *-unknown-linux-musl) ;; *) continue ;; esac
            archive="target/distrib/wsmp-$target.tar.xz"
            dir="$(mktemp -d)"
            tar -xJf "$archive" -C "$dir"
            bin="$dir/wsmp-$target/wsmp"
            file "$bin"
            # Capture first: a failed readelf must fail the job too.
            headers="$(readelf -lW "$bin")"
            dynamic="$(readelf -dW "$bin")"
            if grep -q 'INTERP' <<<"$headers"; then echo "::error::$archive has an ELF interpreter"; exit 1; fi
            if grep -q '(NEEDED)' <<<"$dynamic"; then echo "::error::$archive has shared-library dependencies"; exit 1; fi
            cp /usr/share/doc/musl-dev/copyright "$dir/wsmp-$target/musl-COPYRIGHT.txt"
            tar -cJf "$archive" -C "$dir" "wsmp-$target"
            rm -rf "$dir"
            python3 - "$archive" <<'PYTHON'
          import hashlib
          import json
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          manifest_path = Path('dist-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          artifact = manifest['artifacts'][archive.name]
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          artifact.setdefault('checksums', {})['sha256'] = digest
          artifact.setdefault('assets', []).append({
              'name': 'musl-COPYRIGHT.txt', 'path': 'musl-COPYRIGHT.txt', 'kind': 'license',
          })
          checksum_id = artifact['checksum']
          checksum = archive.parent / checksum_id
          checksum.write_text(f'{digest} *{archive.name}\n')
          manifest['artifacts'][checksum_id].setdefault('checksums', {})['sha256'] = hashlib.sha256(checksum.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PYTHON
          done

      # The GNU builds are what /install.sh installs on glibc Linux (static musl
      # cannot resolve mDNS `*.local` names). It promises them to any glibc at or
      # above CLI_RELEASE_MIN_GLIBC (apps/server/src/node-http.ts): 2.34. The
      # ubuntu-22.04 runners (glibc 2.35, dist-workspace.toml) keep the newest
      # symbol version a build needs at 2.34; this gate fails the release if one
      # needs more. Keep the floor below equal to that constant.
      - name: Verify the GNU binaries' glibc floor
        if: ${{ contains(join(matrix.targets, ','), '-linux-gnu') }}
        shell: bash
        working-directory: apps/cli
        env:
          RELEASE_TARGETS: ${{ join(matrix.targets, ' ') }}
        run: |
          set -euo pipefail
          for target in $RELEASE_TARGETS; do
            case "$target" in *-unknown-linux-gnu) ;; *) continue ;; esac
            dir="$(mktemp -d)"
            tar -xJf "target/distrib/wsmp-$target.tar.xz" -C "$dir"
            bash scripts/check-glibc-floor.sh "$dir/wsmp-$target/wsmp" 2.34
            rm -rf "$dir"
          done

      - id: cargo-dist
        name: Post-build
        shell: bash
        working-directory: apps/cli
        run: |
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            apps/cli/${{ env.BUILD_MANIFEST_NAME }}

  build-cli-global-artifacts:
    name: build-cli-global-artifacts
    needs:
      - plan-cli-release
      - build-cli-local-artifacts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
      WSMP_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Create local release tag
        working-directory: apps/cli
        run: git tag --force "${{ needs.plan-cli-release.outputs.tag }}" "${{ github.sha }}"

      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: apps/cli/target/distrib/
          merge-multiple: true

      - id: cargo-dist
        shell: bash
        working-directory: apps/cli
        run: |
          dist build ${{ needs.plan-cli-release.outputs.tag-flag }} --allow-dirty --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            apps/cli/${{ env.BUILD_MANIFEST_NAME }}

  publish-cli-release:
    name: Publish CLI GitHub Release
    needs:
      - plan-cli-release
      - build-cli-local-artifacts
      - build-cli-global-artifacts
    if: ${{ always() && needs.plan-cli-release.result == 'success' && (needs.build-cli-global-artifacts.result == 'skipped' || needs.build-cli-global-artifacts.result == 'success') && (needs.build-cli-local-artifacts.result == 'skipped' || needs.build-cli-local-artifacts.result == 'success') }}
    # Job-level permissions replace the workflow's: contents to upload the release, id-token and
    # attestations to sign build provenance for the CLI archives (no repository secret involved).
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Create local release tag
        working-directory: apps/cli
        run: git tag --force "${{ needs.plan-cli-release.outputs.tag }}" "${{ github.sha }}"

      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: apps/cli/target/distrib/
          merge-multiple: true

      - id: host
        shell: bash
        working-directory: apps/cli
        run: |
          dist host ${{ needs.plan-cli-release.outputs.tag-flag }} --allow-dirty --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-dist-manifest
          path: apps/cli/dist-manifest.json

      - name: Download GitHub Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: apps/cli/artifacts
          merge-multiple: true

      - name: Cleanup
        run: rm -f apps/cli/artifacts/*-dist-manifest.json

      # /install.sh and /install.ps1 download these archives and verify them against sha256.sum
      # (fail closed). Refuse to publish a release that lacks either, so a node never meets a
      # half-published one.
      - name: Check CLI archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd apps/cli/artifacts
          # cargo-dist ends sha256.sum with a blank line, which `sha256sum --strict` refuses as
          # improperly formatted. Drop blank lines so the published file passes a strict check.
          sed -i '/^[[:space:]]*$/d' sha256.sum
          for archive in wsmp-x86_64-unknown-linux-gnu.tar.xz wsmp-aarch64-unknown-linux-gnu.tar.xz wsmp-x86_64-unknown-linux-musl.tar.xz wsmp-aarch64-unknown-linux-musl.tar.xz wsmp-aarch64-apple-darwin.tar.xz wsmp-x86_64-apple-darwin.tar.xz wsmp-x86_64-pc-windows-msvc.zip; do
            if [ ! -f "$archive" ]; then
              echo "::error::$archive is missing from the release artifacts."
              exit 1
            fi
            if ! awk -v f="$archive" '($2 == f || $2 == "*" f) && $1 ~ /^[0-9a-f]+$/ && length($1) == 64 { found = 1 } END { exit !found }' sha256.sum; then
              echo "::error::sha256.sum has no entry for $archive."
              exit 1
            fi
          done
          sha256sum --check --strict sha256.sum

      # Signed SLSA build provenance for every archive and the checksum file. Verify with
      # `gh attestation verify <file> --repo FlyCockpit/ws-model-proxy`.
      - name: Attest CLI build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            apps/cli/artifacts/wsmp-*.tar.xz
            apps/cli/artifacts/wsmp-*.zip
            apps/cli/artifacts/sha256.sum

      - name: Create or update GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ needs.plan-cli-release.outputs.tag }}"

          # The release body is the version's upgrade notes, then cargo-dist's install section.
          notes_file="docs/release-notes/${tag#v}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error::$notes_file is missing. Write the release notes before releasing (apps/cli/docs/releasing.md)."
            exit 1
          fi
          {
            cat "$notes_file"
            printf '\n\n'
            echo "$ANNOUNCEMENT_BODY"
          } > "$RUNNER_TEMP/notes.txt"

          mapfile -t release_files < <(find apps/cli/artifacts -type f ! -name '*-dist-manifest.json' | sort)
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "::error::No release files found in apps/cli/artifacts."
            find apps/cli/artifacts -maxdepth 3 -print | sort
            exit 1
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt"
            gh release upload "$tag" --clobber "${release_files[@]}"
          else
            gh release create "$tag" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" "${release_files[@]}"
          fi

  publish-homebrew-formula:
    name: Publish Homebrew formula
    needs:
      - validate
      - publish-cli-release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Validate tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::Set HOMEBREW_TAP_TOKEN to a token with contents:write access to FlyCockpit/homebrew-tap."
            exit 1
          fi

      - name: Download generated formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - id: formula
        name: Find generated formula
        shell: bash
        run: |
          set -euo pipefail

          formula_path="$(find artifacts -type f -name wsmp.rb -print -quit)"
          if [ -z "$formula_path" ]; then
            echo "::error::Generated wsmp.rb formula was not found in downloaded artifacts."
            find artifacts -maxdepth 3 -print | sort
            exit 1
          fi

          echo "path=$formula_path" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FlyCockpit/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          fetch-depth: 0

      - name: Commit formula to tap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p homebrew-tap/Formula
          cp "${{ steps.formula.outputs.path }}" homebrew-tap/Formula/wsmp.rb

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/wsmp.rb
          if git diff --cached --quiet -- Formula/wsmp.rb; then
            echo "Formula/wsmp.rb already matches ${{ needs.validate.outputs.tag }}."
            exit 0
          fi

          git commit -m "wsmp ${{ needs.validate.outputs.tag }}"
          git push origin HEAD:main

  release-summary:
    name: Release summary
    needs:
      - validate
      - publish-container
      - publish-cli-release
      - publish-homebrew-formula
    if: ${{ always() && needs.publish-container.result == 'success' && needs.publish-cli-release.result == 'success' && needs.publish-homebrew-formula.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## Release ${{ needs.validate.outputs.tag }}"
            echo
            echo "- Container: \`${{ needs.validate.outputs.image }}:${{ needs.validate.outputs.tag }}\`"
            echo "- CLI artifacts: GitHub Release \`${{ needs.validate.outputs.tag }}\` (sha256.sum, build provenance attested)"
            echo "- Homebrew: \`brew install flycockpit/tap/wsmp\`"
          } >> "$GITHUB_STEP_SUMMARY"
