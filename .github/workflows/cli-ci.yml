name: CLI CI

on:
  push:
    branches: [main]
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
  schedule:
    # Check RustSec advisories regularly without making unrelated PRs flaky.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/cli

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/cli -> target
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked

  # Real exchange-less mounts for the file tools (issue #172): a FUSE passthrough daemon in
  # eight classes (NOREPLACE/link/neither with and without stable inode numbers, constant link
  # counts, libfuse attribute caching) runs the
  # env-gated real-filesystem test. Nothing is installed: gcc, the distro's setuid
  # fusermount3 and libfuse3.so.3 come with the image, and the daemon compiles against the
  # vendored libfuse 3.14 headers (apps/cli/tests/support/exchangeless/vendor/libfuse3).
  # Pinned to 24.04: Ubuntu 26.04 (ubuntu-latest from 2026-11-19) ships
  # libfuse 3.18 only as libfuse3.so.4; this test links libfuse3.so.3.
  # The job FAILS (never skips) when it cannot mount.
  exchangeless-fs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/cli -> target
      - run: bash scripts/test-exchangeless-fs.sh test
      # A cancelled job may leave a mount behind; this unmounts only FUSE mounts under RUNNER_TEMP.
      - if: always()
        run: bash scripts/test-exchangeless-fs.sh cleanup

  musl:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/cli -> target
          key: musl
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Build and verify a static binary
        run: |
          set -euo pipefail
          cargo build --release --target x86_64-unknown-linux-musl --locked
          bin=target/x86_64-unknown-linux-musl/release/wsmp
          file "$bin"
          headers="$(readelf -lW "$bin")"
          dynamic="$(readelf -dW "$bin")"
          if grep -q 'INTERP' <<<"$headers"; then echo "::error::wsmp has an ELF interpreter"; exit 1; fi
          if grep -q '(NEEDED)' <<<"$dynamic"; then echo "::error::wsmp has shared-library dependencies"; exit 1; fi
      - run: cargo test --lib --target x86_64-unknown-linux-musl --locked

  # The GNU release builds run on ubuntu-22.04 so they need at most glibc 2.34
  # (CLI_RELEASE_MIN_GLIBC in apps/server/src/node-http.ts, which /install.sh
  # checks before it picks the GNU archive). Catch a dependency that raises the
  # floor here, not at release time. 22.04 runners retire 2027-04-17.
  glibc-floor:
    runs-on: ubuntu-22.04
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/cli -> target
          key: glibc-floor
      - run: cargo build --release --locked
      - run: bash scripts/check-glibc-floor.sh target/release/wsmp 2.34

  fmt:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/cli -> target
      - run: cargo clippy --workspace --all-targets --all-features --locked

  msrv:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/cli -> target
      - run: cargo build --workspace --locked

  deny:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check bans licenses sources
          # cargo-deny 0.20 takes --config before the subcommand.
          arguments: --config apps/cli/deny.toml
          manifest-path: apps/cli/Cargo.toml

  advisories:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories
          # cargo-deny 0.20 takes --config before the subcommand.
          arguments: --config apps/cli/deny.toml
          manifest-path: apps/cli/Cargo.toml

  docs-drift:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/cli -> target
      - run: cargo xtask sync-docs --check

  typos:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: typos-cli@1.52.0
      - run: typos

  policy:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/policy-checks.sh
