name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server
        - Web dashboard
        - wsmp CLI
        - MCP
        - Docs
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and access considerations
      description: Does this change who can access nodes, commands, files, terminals or models, or what the server stores?
