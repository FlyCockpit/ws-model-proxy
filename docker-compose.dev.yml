# Local development services — Postgres
# Credentials match .env.example defaults so no extra config is needed.
#
# Usage:
#   pnpm dev:services          # start in background
#   docker compose -f docker-compose.dev.yml down   # stop
#   docker compose -f docker-compose.dev.yml down -v # stop + delete data
#
# Each checkout uses its own database on this one Postgres (`ws-model-proxy` in
# the main checkout, `ws_model_proxy_wt_<hash>` in a git worktree, plus
# `<name>_shadow`). `pnpm db:worktree` creates them; `pnpm db:reset:local`
# recreates only this checkout's database. Reset drops only databases marked
# disposable: `ws-model-proxy` is marked by the init script below on a fresh
# volume, the others by `pnpm db:worktree`. A volume initialized before the
# mark existed is adopted once by a person: `pnpm db:worktree --adopt`.

name: ws-model-proxy-dev

services:
  postgres:
    image: postgres:17
    container_name: ws-model-proxy-dev-postgres
    environment:
      POSTGRES_DB: ws-model-proxy
      POSTGRES_USER: postgres
      # DEV ONLY — do not use this password in production.
      POSTGRES_PASSWORD: password
    ports:
      # Bind to loopback only. A bare "5432:5432" binds 0.0.0.0 and, because
      # Docker writes its own iptables rules ahead of ufw/firewalld, would
      # expose Postgres to the public internet on a VPS — with the dev password
      # below — even behind a closed host firewall. localhost dev is unaffected.
      - "127.0.0.1:5432:5432"
    volumes:
      - wsmp_dev_postgres:/var/lib/postgresql/data
      # Marks POSTGRES_DB as a disposable local database on first init.
      - ./scripts/db/dev-postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  wsmp_dev_postgres:
