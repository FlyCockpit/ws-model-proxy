# Production: one web service plus Postgres. No backup service/storage required.
# Supply the required settings through your platform or --env-file.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ws-model-proxy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a random database password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ws-model-proxy"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set a random database password}@postgres:5432/ws-model-proxy
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set a random auth secret of at least 32 characters}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set the public app origin}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:?set the actual number of reverse proxies}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set the bootstrap owner email}
      # Optional: passed through when set in the env file, empty (= unset) otherwise.
      WMP_PROVIDER_CREDENTIAL_ENCRYPTION_KEYS: ${WMP_PROVIDER_CREDENTIAL_ENCRYPTION_KEYS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 52s
    restart: unless-stopped

volumes:
  postgres:
