packages:
  - apps/*
  - packages/*
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Each selector lifts a transitive out of its vulnerable range. Selectors are
# scoped tightly so unrelated majors are untouched. Every target must clear the
# 7-day minimum-age gate; a security release that cannot wait goes in a
# minimumReleaseAgeExclude list as an exact pin.
# Security-fix carve-outs only. Each entry MUST carry a `drop-after: YYYY-MM-DD`
# marker in its comment; `pnpm deps:check-excludes` (CI lint job) fails the build
# once that date has passed, so a one-week carve-out cannot quietly become a
# permanent exemption from the gate. Prefer an exact `<pkg>@<version>` entry so a
# newer, unvetted release stays gated, and keep the list in block style (the
# checker does not parse flow style).
minimumReleaseAgeExclude:
  # (no carve-outs at the moment)
overrides:
  picomatch@>=4 <4.0.4: ">=4.0.4" # CVE-2026-33671 (ReDoS via extglob)
  defu@<6.1.5: ">=6.1.5" # CVE-2026-35209 (prototype pollution)
  "brace-expansion@>=2 <2.1.7": 2.1.7 # denial-of-service fixes (incl. CVE-2026-102276 / CVE-2026-102278)
  # GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc / GHSA-fph4-wmhf-6fwf /
  # GHSA-jqff-g426-hqxp (<4.1.3) and GHSA-hrr3-gc8f-f4qj / GHSA-jvvf-x445-j334
  # (<4.1.5), and GHSA-w74x-v6f9-j3xg / GHSA-wjr9-j795-jxcr / GHSA-xhq7-xmqj-769h /
  # GHSA-333x-w4r6-6crp (<4.2.3). 4.2.3 is the newest release that clears the
  # 7-day gate.
  "fast-uri@>=4 <4.2.3": 4.2.3
  "ajv@8.20.0>fast-uri": 4.2.3 # Explicit parent pin also lifts existing lock entries to the patched release.
  "source-map-js@<1.2.2": 1.2.2 # GHSA-68fv-2mgg-jv7q / CVE-2026-93749 (high)
  # GHSA-p6vx-979v-rg4c (critical, <=1.6.0) / GHSA-jp82-f5mq-hwhp (high,
  # <=1.6.2) / GHSA-97r2-qh9m-474h and CVE-2026-116580 (high, <=1.6.7) /
  # GHSA-9wx9-5pv9-3349 (<1.6.10) / GHSA-f86p-h4j2-7qgj (<1.6.11).
  # @tanstack/query-devtools 5.103+ depends on solid-js at runtime. solid-js
  # 1.9.18 asks seroval ~1.6.11 and @tanstack/router-core ^1.6.7, so both admit
  # the patched 1.6.12; the override only keeps the lock from settling on an
  # older 1.6.x. Drop once both dependents require seroval >=1.6.11.
  "seroval@<1.6.11": 1.6.12
  "seroval-plugins@<1.6.11": 1.6.12
  # 0.35.0 is still inside GHSA-rgj7-g3m4-5g8c (libheif, patched in 0.35.4).
  # 0.35.5 is the newest release that clears the 7-day gate.
  "sharp@>=0.33 <0.35.5": 0.35.5
  # sharp-ico depends on sharp "*", so the ranged override above does not
  # select it and the lock stays on 0.35.0 without this parent pin.
  "sharp-ico@0.1.5>sharp": 0.35.5
  # GHSA-mqg3-3v4r-cm32 (high, patched in 8.12.4); keep 8.x on the newest
  # patched release that clears the 7-day gate.
  "undici@>=8 <8.12.4": 8.12.4
  # GHSA-mrhx-c7xc-m3w5 (high, DoS via unbounded array validation, patched in
  # 4.6.6). @better-auth/core resolved its own older copy; lifting every 4.x below
  # the catalog's 4.6.7 to it keeps a single installed zod.
  "zod@>=4 <4.6.7": 4.6.7
  # CVE-2026-44635 (JSON-path injection) is patched in 0.28.17. Pinned EXACT
  # (not just `>=0.28.17`) to dedupe to a single installed copy: better-auth
  # 1.7.18 declares kysely as a DEPENDENCY (`^0.28.17 || ^0.29.0`, no kysely
  # peer entry) while @better-auth/core@1.7.18 PEERS `^0.28.5 || ^0.29.0`.
  # Both ranges admit 0.29.x, so without the exact pin pnpm may resolve
  # 0.29.x for some dependents and 0.28.x for others, and duplicate
  # @better-auth/core copies split plugin types. `pnpm why kysely` shows
  # exactly one 0.29.8; better-auth does not call the removed 0.29 APIs.
  # kysely is only used transitively via better-auth here.
  kysely: 0.29.8
  # workbox-build 7.4.1 still asks for glob ^11; GHSA-3g3m-2fjr-6pw4
  # affects glob through 14.0.1. Its globSync() API remains compatible in 14;
  # the build check compares the generated precache list. Drop once upstream
  # requires glob >=14.0.2.
  "workbox-build@7.4.1>glob": 14.0.3
  # GHSA-g3hv-75wg-m249 has no minimatch 10.x backport. This dev-only
  # react-doctor -> eslint/config-array override crosses their ^10 range:
  # both only use new Minimatch() and .match(), which remain compatible in 11.
  "minimatch@>=10 <11.0.1": 11.0.4
  # workbox-build transitives — vite-plugin-pwa 2.0.0 → workbox-build 7.4.1 is
  # the latest upstream release and still pulls in vulnerable versions. Drop
  # these overrides if workbox-build patches the chain.
  serialize-javascript@<7.1.3: ">=7.1.3" # GHSA-5c6j-r48x-rmvq (RCE via RegExp.flags) / GHSA-gfhx-hw2g-v5hg / GHSA-m5mm-p8h7-m29v
  lodash@<4.18.0: ">=4.18.0" # GHSA-r5fr-rjxr-66jc (code injection via _.template)
  # GHSA-7589-6fvf-x4pw (high, ReDoS in Schema.TemplateLiteral, patched in 3.22.1).
  # @prisma/config pins effect 3.20.0 exactly; 3.22.4 is the newest 3.x release
  # that clears the 7-day gate. Drop once Prisma requires effect >=3.22.1.
  "effect@<3.22.1": 3.22.4
blockExoticSubdeps: true
dangerouslyAllowAllBuilds: false
savePrefix: ""
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  msw: true
  prisma: true
  sharp: true
# Catalog: single-version deps shared across workspace packages.
# Bump shared dependency versions here, not in individual package.json files.
catalog:
  "@fastify/busboy": 3.2.5
  # Off-site pre-migration / scheduled backups (scripts/backup/s3.mjs, BACKUP_S3_*).
  # A root dependency so the image's prod install (--include-workspace-root) ships it.
  "@aws-sdk/client-s3": ^3.1164.0
  dotenv: ^18.0.10
  zod: ^4.6.7
  "@types/node": ^26.6.6
  "@types/ws": ^8.18.2
  # Types for pg (packages/db); keep on the pg 8.x line of packages/db.
  "@types/pg": ^8.23.1
  # Exact pin: packages/db/src/pg-internals.ts and client-factory.ts rely on
  # pg (and pg-pool) internals by source line (release guard, dispatch fence,
  # query_timeout normalization). Bump deliberately, re-check those lines,
  # and run the PostgreSQL suites that pg-internals.ts names.
  pg: 8.23.1
  hono: ^4.13.18 # GHSA-39q9-qp46-w8xg
  "@orpc/server": ^1.16.2
  "@orpc/openapi": ^1.16.2
  "@orpc/zod": ^1.16.2
  "@orpc/tanstack-query": ^1.16.2
  # Exact pins: the 1.7.x family must stay aligned so @better-auth/core and
  # plugin types resolve to a single copy. 1.7.18 fixes GHSA-fvxx-76fc-893x and
  # GHSA-9hm7-xhfp-cx58 (carved out of the release-age gate above until it ages
  # in); bump the whole family together.
  better-auth: 1.7.18
  "@better-auth/oauth-provider": 1.7.18
  "@better-auth/mcp": 1.7.18
  "@better-auth/cimd": 1.7.18
  # MCP SDK v2 (server transport). Exact pin: the handler/auth-adapter API
  # surface is versioned with the protocol; bump deliberately.
  "@modelcontextprotocol/server": 2.4.0
  lucide-react: ^1.70.0
  next-themes: ^0.4.6
  react: ^19.3.1
  react-dom: ^19.3.1
  # Required recharts peer; keep aligned with react.
  react-is: ^19.3.1
  # shadcn chart component (packages/ui/src/components/chart.tsx).
  recharts: ^3.10.1
  # Test page chat answers (apps/web/src/components/test/chat-markdown.tsx).
  # Exact pins; raw HTML stays off (no rehype-raw).
  react-markdown: 10.1.0
  remark-gfm: 4.0.1
  sileo: ^0.1.6
  "@prisma/client": ^7.10.1
  "@orpc/client": ^1.16.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.8
  tailwindcss: ^4.3.5
  # Keep on the same release as tailwindcss.
  "@tailwindcss/vite": ^4.3.5
  typescript: ^7.0.2
  vite: ^8.3.8
  "@vitejs/plugin-react": ^6.3.0
  postcss: ^8.5.32
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-query": ^5.107.1
  "@tanstack/react-query-devtools": ^5.107.1
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-router-devtools": ^1.167.3
  "@tanstack/react-router-ssr-query": ^1.167.3
  "@tanstack/react-start": ^1.169.5
  tsx: ^4.23.15
  vitest: ^5.1.0
  vitest-mock-extended: ^6.0.0
  rate-limiter-flexible: ^11.4.0
  ws: ^8.23.0
  nodemailer: ^10.4.0
  "@types/nodemailer": ^8.0.2
  tsdown: ^0.23.7
  i18next: ^27.0.1
  jsdom: 31.0.0
  react-i18next: ^18.0.1
  i18next-browser-languagedetector: ^8.3.0
  openai: ^7.53.0
  "@anthropic-ai/sdk": ^1.6.0
  "qrcode.react": ^4.2.0
  "@fontsource-variable/inter": ^5.3.0
  # xterm.js 6 plus the fit and web-links addons published for that line.
  # Stable 0.11 / 0.12 addons declare xterm v4+ and have no peer pin.
  "@xterm/xterm": ^6.0.0
  "@xterm/addon-fit": ^0.11.0
  "@xterm/addon-web-links": ^0.12.0
