  tsx: ^4.23.8
  vitest: ^4.1.10
  vitest-mock-extended: ^5.1.1
  rate-limiter-flexible: ^11.2.0
  ws: ^8.21.2
  nodemailer: ^9.0.4
  "@types/nodemailer": ^8.0.1
  tsdown: ^0.22.14
