packages:
  - apps/*
  - packages/*
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Excludes for packages that fail the 7-day minimum-age check on re-resolution.
minimumReleaseAgeExclude:
  # Security releases are allowed through immediately; exact pins keep the
  # exception from weakening the age gate for future versions.
  - brace-expansion@2.1.4||5.0.9 # CVE-2026-13149 / CVE-2026-14257 / CVE-2026-69152
  - fast-uri@4.1.2 # CVE-2026-16221 / CVE-2026-18446
# Each selector lifts a transitive out of its vulnerable range. Selectors are
# scoped tightly so unrelated majors are untouched; explicitly listed security
# releases above are the only exceptions to the 7-day minimum-age gate.
overrides:
  hono@<4.12.25: ">=4.12.25" # CVE-2026-54290 (CORS credential origin reflection)
  picomatch@>=4 <4.0.4: ">=4.0.4" # CVE-2026-33671 (ReDoS via extglob)
  defu@<6.1.5: ">=6.1.5" # CVE-2026-35209 (prototype pollution)
  fast-uri@<3.1.2: ">=3.1.2" # CVE-2026-6321 / CVE-2026-6322 (path traversal)
  "brace-expansion@>=2 <2.1.4": 2.1.4 # denial-of-service fixes
  "brace-expansion@>=5 <5.0.9": 5.0.9 # denial-of-service fixes
  "fast-uri@>=4 <4.1.2": 4.1.2 # denial-of-service and host-confusion fixes
  "ajv@8.20.0>fast-uri": 4.1.2 # pnpm 11.1 does not re-resolve the ranged override from the existing lock entry
  "ip-address@>=10 <10.3.1": 10.3.1 # CVE-2026-69192
  "postcss@>=8 <8.5.23": ">=8.5.23" # GHSA-r28c-9q8g-f849 / GHSA-fxqj-rqcc-2cmp (path traversal / source map disclosure)
  "sharp@>=0.33 <0.35.0": 0.35.0 # GHSA-f88m-g3jw-g9cj (libvips vulnerabilities)
  "undici@>=7 <7.29.0": 7.29.0 # CVE-2026-13697
  # CVE-2026-44635 (JSON-path injection) is patched in 0.28.17. Pinned EXACT
  # (not just `>=0.28.17`) to dedupe @better-auth/core: better-auth 1.6.11 peers
  # `kysely ^0.28.17` (excludes the otherwise-hoisted 0.29.0), and duplicate
  # @better-auth/core copies split plugin types. kysely is only used
  # transitively via better-auth here.
  kysely: 0.28.17
  path-to-regexp@>=8 <8.4.0: ">=8.4.0" # CVE-2026-4926 (ReDoS)
  # Peer-range alignment after 2026-06 dependency refresh. These are scoped to
  # the packages that declare the peers and all target releases are older than
  # the 7-day minimumReleaseAge gate.
  "vite-plugin-pwa@1.3.0>workbox-build": 7.4.1
  # workbox-build transitives — vite-plugin-pwa 1.3.0 → workbox-build 7.4.1 is
  # the latest upstream release and still pulls in vulnerable versions. Drop
  # these overrides if workbox-build patches the chain.
  serialize-javascript@<7.0.3: ">=7.0.3" # GHSA-5c6j-r48x-rmvq (RCE via RegExp.flags)
  lodash@<4.18.0: ">=4.18.0" # GHSA-r5fr-rjxr-66jc (code injection via _.template)
  "@babel/plugin-transform-modules-systemjs@<7.29.4": ">=7.29.4 <7.29.7" # GHSA-fv7c-fp4j-7gwp (cap excludes too-young 7.29.7)
blockExoticSubdeps: true
dangerouslyAllowAllBuilds: false
savePrefix: ""
# Moved here from the package.json "pnpm" field, which pnpm 11 no longer reads.
peerDependencyRules:
  allowedVersions:
    vite: "*"
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  msw: true
  prisma: true
  sharp: true
# Catalog: single-version deps shared across workspace packages.
