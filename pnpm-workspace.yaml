  mediabunny: ^1.52.3
  dotenv: ^17.4.2
  zod: ^4.4.3
  "@types/node": ^26.1.2
  "@types/ws": ^8.18.1
  hono: ^4.13.0
  "@orpc/server": ^1.14.14
  "@orpc/openapi": ^1.14.14
  "@orpc/zod": ^1.14.14
  better-auth: ^1.6.26
  lucide-react: ^1.28.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  react-markdown: 10.1.0
  rehype-highlight: 7.0.2
  highlight.js: 11.11.1
  remark-gfm: 4.0.1
