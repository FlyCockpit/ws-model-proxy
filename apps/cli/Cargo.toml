# ─────────────────────────────────────────────────────────────────────────────
# This is the crate manifest for your CLI.
#
# CLI package and binary for WS Model Proxy. Keep the package name and
# [[bin]] name aligned so release artifacts and `assert_cmd` tests use the same
# executable.
# ─────────────────────────────────────────────────────────────────────────────

[package]
name = "wsmp"
version = "0.3.1"
edition = "2024"
publish = false
# Minimum Supported Rust Version. Edition 2024 requires >= 1.85; tiktoken-rs
# 0.12.0 uses let chains, which need >= 1.88. The `msrv` CI job is the source
# of truth — if you add a dependency that needs newer, bump this and the job
# will tell you.
rust-version = "1.88"
description = "Command-line relay client for WS Model Proxy."
authors = ["WS Model Proxy contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/FlyCockpit/ws-model-proxy"
homepage = "https://github.com/FlyCockpit/ws-model-proxy"
documentation = "https://github.com/FlyCockpit/ws-model-proxy#readme"
keywords = ["cli", "command-line"]
categories = ["command-line-utilities"]
# Files not shipped in the crates.io tarball.
exclude = ["tap/", "AGENTS.md", "CLAUDE.md", ".cursorrules"]

[package.metadata.dist]
dist = true

[[bin]]
name = "wsmp"
path = "src/main.rs"

[dependencies]
# Error handling. anyhow for application code (rich context, easy `?`). Reach
# for `thiserror` only when you publish a library with a stable error API; see
# docs/error-handling.md.
anyhow = "1"
# Argument parsing + shell completions.
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
# Cross-platform config/data directories (XDG on Linux, the right spots
# on macOS and Windows).
dirs = "7"
# Serialization. serde_json powers `--json` output; toml powers the human-edited
# config file.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Random slug suffix generation.
rand = "0.10"
# Temporary files for atomic config writes.
tempfile = "3"
# HTTP calls to the self-hosted app and OpenAI-compatible local endpoints.
ureq = { version = "3", features = ["json"] }
# SHA-256 inventory identity must match the server's acknowledged revision.
sha2 = "0.11"
# Async HTTP transport permits cancellation to interrupt connect, upload, and
# response reads instead of merely setting a flag beside a blocking request.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util"] }
# The `Stream` trait lets a request body remain credit-paced while reqwest owns
# the cancellable connection future.
futures-core = "0.3"
# URL parsing and joining for server/local endpoint paths.
url = "2"
# Foreground daemon websocket connection to the app relay.
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# Structured logging. `--log-format`, `RUST_LOG`/`WSMP_LOG` filtering.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Still-image decode/re-encode when `expandMedia` inlines signed media URLs for
# local upstreams that only accept JPEG/PNG data URLs (not WebP/GIF).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# A single shared tokenizer makes fallback throughput comparable across
# heterogeneous upstream models. Pin to the MSRV-compatible release.
tiktoken-rs = "=0.12.0"
# Terminal session crypto. Versions stay on the digest 0.11 line with sha2 0.11.
hkdf = "0.13"
aes-gcm = "0.11"
base64 = "0.23"
p256 = { version = "0.14", features = ["ecdh"] }

[target.'cfg(unix)'.dependencies]
# Maintained Unix API wrapper used only for authenticated local-control peer
# credentials and for killing terminal/exec process groups. `socket` exposes
# SO_PEERCRED/LOCAL_PEERCRED and `user` exposes the current effective UID
# without unsafe FFI. `signal` covers process-group SIGKILL.
nix = { version = "0.31", default-features = false, features = ["fs", "socket", "user", "signal", "process", "poll"] }
# Unix PTY. Its unsafe code stays inside the crate (`unsafe_code` is forbid
# here). Windows v1 reports terminals unsupported and does not link this crate.
portable-pty = "0.9"
# `dup(2)` of the PTY master. Opening `/proc/self/fd/N` follows the ptmx
# symlink and allocates a new pty, so the reader cannot poll that path.
filedescriptor = "0.8"

[target.'cfg(windows)'.dependencies]
# Console control events (Ctrl-C, Ctrl-Break, close, shutdown) start the same
# bounded relay shutdown as SIGINT/SIGTERM on Unix. Unix keeps `sigwait`.
tokio = { version = "1", features = ["signal"] }

[dev-dependencies]
# Black-box CLI testing: run the built binary and assert on stdout/stderr/exit.
assert_cmd = "2"
predicates = "3"

# ── Lints ────────────────────────────────────────────────────────────────────
# Centralized lint policy. CI runs clippy with `-D warnings`, so anything `warn`
# here fails the build in CI but stays a warning locally. Edit deliberately.
[lints.rust]
# No `unsafe` in a CLI like this — if you genuinely need it, change this to
# "deny" and gate each block with a `// SAFETY:` comment.
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Guardrails that catch the bad decisions agents most often make:
unwrap_used = "warn"        # prefer `?`/`expect("why")` over silent panics
expect_used = "allow"       # `expect` with a reason is fine; flip to warn if strict
todo = "warn"               # don't ship `todo!()`
dbg_macro = "warn"          # don't ship `dbg!()`
print_stdout = "warn"       # use `src/output.rs` so stdout stays deliberate
print_stderr = "warn"       # use tracing or structured error handling

# ── Release profile ──────────────────────────────────────────────────────────
# Optimized for small, fast distributed binaries. Used by `dist` for releases.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# The profile `dist` uses for cutting releases (inherits release, kept separate
# so you can tune release builds without affecting local `cargo build --release`).
[profile.dist]
inherits = "release"

[workspace]
members = ["xtask"]
