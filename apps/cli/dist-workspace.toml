[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
# Released 0.4.x `wsmp update` requests the GNU manifest key and extracts
# wsmp-<its own GNU triple>/wsmp. Homebrew's Linux blocks also come from GNU
# targets. Keep genuine GNU artifacts throughout 1.x; drop them at 2.0.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The GitHub repo that hosts your Homebrew tap. dist generates wsmp.rb as a
# release artifact; the root Release workflow then commits that file into this
# tap with HOMEBREW_TAP_TOKEN.
tap = "FlyCockpit/homebrew-tap"
# Keep this aligned with the root Release workflow's publish-homebrew-formula
# job. If the workflow is regenerated from cargo-dist, review the generated
# Homebrew publish job before replacing the hand-rolled monorepo workflow.
publish-jobs = ["homebrew"]
# The root manual Release workflow consumes this config from the monorepo root.
# Pull-request cargo-dist runs are plan-only when generated locally.
pr-run-mode = "plan"
# Release requests must pass the root release-preflight workflow before artifacts build.
plan-jobs = ["./release-preflight"]

# Keep the Apple Silicon runner explicit when upgrading cargo-dist.
[dist.github-custom-runners]
global = "ubuntu-latest"
x86_64-unknown-linux-musl = "ubuntu-latest"
# GitHub has no ubuntu-latest arm64 label; this is the matching arm image as of 2026-11.
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
# GNU builds are what /install.sh installs on glibc >= 2.34 (static musl cannot
# resolve mDNS `*.local` names), and what 0.4.x nodes and Linuxbrew update to.
# Built on 22.04 (glibc 2.35) so they need at most GLIBC_2.34
# (CLI_RELEASE_MIN_GLIBC in apps/server/src/node-http.ts); release.yml and
# cli-ci.yml check it with scripts/check-glibc-floor.sh. These runners are
# OS-dependent on purpose; 22.04 retires 2027-04-17 (move to a 2.34-era
# container then, e.g. a manylinux_2_34 or Debian 12 image with the floor checked).
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
aarch64-apple-darwin = "macos-15"

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
